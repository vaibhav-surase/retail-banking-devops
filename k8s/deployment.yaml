apiVersion: apps/v1
kind: Deployment

metadata:
  name: retail-banking-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: retail-banking-app

  template:

    metadata:
      labels:
        app: retail-banking-app

    spec:

      containers:

        - name: retail-banking-app

          image: 470451076070.dkr.ecr.ap-south-1.amazonaws.com/retail-banking-app:1.0

          ports:
            - containerPort: 8081

          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"

          readinessProbe:
            httpGet:
              path: /health
              port: 8081

            initialDelaySeconds: 20
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 8081

            initialDelaySeconds: 30
            periodSeconds: 20
