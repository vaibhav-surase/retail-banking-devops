apiVersion: apps/v1
kind: Deployment

metadata:
  name: {{ .Release.Name }}

spec:

  replicas: {{ .Values.replicaCount }}

  selector:
    matchLabels:
      app: banking-app

  template:

    metadata:
      labels:
        app: banking-app

    spec:

      containers:

        - name: banking-app

          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"

          ports:
            - containerPort: 8081

          readinessProbe:
            httpGet:
              path: /health
              port: 8081

            initialDelaySeconds: 20
            periodSeconds: 10
